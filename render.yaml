services:
  - type: web
    runtime: static
    name: panel-accesos
    plan: free
    buildCommand: npm install && npm --prefix apps/auditorias ci && npm --prefix apps/tallas ci && npm --prefix apps/telas ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_EMAILJS_SERVICE_ID
        value: service_bd757ws
      - key: VITE_EMAILJS_TEMPLATE_ID
        value: template_qkdmp94
      - key: VITE_EMAILJS_PUBLIC_KEY
        value: CTcGehX8rVCk1JDt6
    routes:
      - type: rewrite
        source: /auditorias
        destination: /auditorias/index.html
      - type: rewrite
        source: /auditorias/*
        destination: /auditorias/index.html
      - type: rewrite
        source: /tallas
        destination: /tallas/index.html
      - type: rewrite
        source: /tallas/
        destination: /tallas/index.html
      - type: rewrite
        source: /tallas/*
        destination: /tallas/index.html
      - type: rewrite
        source: /telas
        destination: /telas/index.html
      - type: rewrite
        source: /telas/
        destination: /telas/index.html
      - type: rewrite
        source: /telas/*
        destination: /telas/index.html
      - type: rewrite
        source: /*
        destination: /index.html
