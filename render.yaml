services:
  - type: web
    runtime: static
    name: panel-accesos
    buildCommand: npm install && npm --prefix apps/crearte ci && npm --prefix apps/tallas ci && npm --prefix apps/telas ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /crearte
        destination: /crearte/index.html
      - type: rewrite
        source: /crearte/*
        destination: /crearte/index.html
      - type: rewrite
        source: /tallas
        destination: /tallas/index.html
      - type: rewrite
        source: /tallas/
        destination: /tallas/index.html
      - type: rewrite
        source: /telas
        destination: /telas/index.html
      - type: rewrite
        source: /telas/
        destination: /telas/index.html
      - type: rewrite
        source: /*
        destination: /index.html
