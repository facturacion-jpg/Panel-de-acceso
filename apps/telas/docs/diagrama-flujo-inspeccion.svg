<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title description">
  <title id="title">Flujo de inspección de telas CREARTE</title>
  <desc id="description">Diagrama desde el inicio de una inspección, la captura y cálculo de rollos, la decisión del lote, el guardado local y las salidas de reporte por correo o PDF.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8f6"/>
      <stop offset="1" stop-color="#e7f0ec"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172b25"/>
      <stop offset="1" stop-color="#315448"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#203d32" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 11 6 1 11" fill="none" stroke="#71877b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #20332c; }
      .title { font-size: 38px; font-weight: 800; fill: #fff; letter-spacing: .3px; }
      .subtitle { font-size: 19px; fill: #dce9e2; }
      .section { font-size: 17px; font-weight: 800; fill: #557064; letter-spacing: 1.7px; }
      .node-title { font-size: 22px; font-weight: 750; }
      .node-text { font-size: 17px; fill: #4a6055; }
      .small { font-size: 15px; fill: #536b5f; }
      .edge-label { font-size: 16px; font-weight: 750; fill: #526a5e; }
      .flow { fill: none; stroke: #71877b; stroke-width: 3; marker-end: url(#arrow); }
      .node { filter: url(#shadow); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1440" fill="url(#background)"/>
  <rect x="48" y="38" width="1504" height="132" rx="26" fill="url(#header)"/>
  <path d="M48 143h1504" stroke="#f2c400" stroke-width="5"/>
  <text x="92" y="96" class="title">INSPECCIÓN DE TELAS</text>
  <text x="94" y="132" class="subtitle">CREARTE BY CONFECCIONARTE · del registro al reporte</text>
  <rect x="1290" y="75" width="205" height="48" rx="24" fill="#f2c400"/>
  <text x="1392" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#20201d">FLUJO PRINCIPAL</text>

  <text x="100" y="222" class="section">CAPTURA Y CÁLCULO</text>
  <text x="1100" y="222" class="section">GUARDADO Y SALIDAS</text>

  <g class="node">
    <rect x="590" y="250" width="420" height="74" rx="37" fill="#fff" stroke="#76a18a"/>
    <circle cx="634" cy="287" r="20" fill="#e1f1e7"/>
    <path d="M627 287h14m-7-7v14" stroke="#3b7657" stroke-width="3" stroke-linecap="round"/>
    <text x="672" y="282" class="node-title">Iniciar inspección</text>
    <text x="672" y="305" class="node-text">fecha local y campos vacíos</text>
  </g>
  <path class="flow" d="M800 324v38"/>

  <g class="node">
    <rect x="540" y="366" width="520" height="105" rx="20" fill="#fff" stroke="#83a692"/>
    <rect x="562" y="387" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="586" y="418" text-anchor="middle" font-size="22" font-weight="800">1</text>
    <text x="630" y="405" class="node-title">Completar datos generales</text>
    <text x="630" y="432" class="node-text">proveedor · tela · remisión · fecha · límites</text>
    <text x="630" y="454" class="small">src/components/InspectionForm.jsx</text>
  </g>
  <path class="flow" d="M800 471v38"/>

  <g class="node">
    <rect x="540" y="513" width="520" height="112" rx="20" fill="#fff" stroke="#83a692"/>
    <rect x="562" y="536" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="586" y="567" text-anchor="middle" font-size="22" font-weight="800">2</text>
    <text x="630" y="552" class="node-title">Capturar uno o más rollos</text>
    <text x="630" y="579" class="node-text">largo · ancho · defectos D1–D4 · color · notas</text>
    <text x="630" y="604" class="small">src/components/RollTable.jsx · filas progresivas</text>
  </g>
  <path class="flow" d="M800 625v38"/>

  <g class="node">
    <rect x="500" y="667" width="600" height="129" rx="20" fill="#fff" stroke="#c5a321"/>
    <rect x="524" y="692" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="548" y="723" text-anchor="middle" font-size="22" font-weight="800">3</text>
    <text x="592" y="703" class="node-title">Calcular calidad automáticamente</text>
    <text x="592" y="732" class="node-text">Puntos = D1 + 2×D2 + 3×D3 + 4×D4</text>
    <text x="592" y="758" class="node-text">Puntos / 100 yd² → decisión individual del rollo</text>
    <text x="592" y="780" class="small">src/utils/calculations.js</text>
  </g>
  <path class="flow" d="M800 796v39"/>

  <g class="node">
    <rect x="500" y="839" width="600" height="120" rx="20" fill="#fff" stroke="#83a692"/>
    <rect x="524" y="863" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="548" y="894" text-anchor="middle" font-size="22" font-weight="800">4</text>
    <text x="592" y="878" class="node-title">Confirmar captura de rollos</text>
    <text x="592" y="907" class="node-text">“Guardar rollos” copia el borrador al resumen</text>
    <text x="592" y="934" class="small">Si no hay medidas completas, se muestra un error</text>
  </g>
  <path class="flow" d="M800 959v36"/>

  <g class="node">
    <rect x="500" y="999" width="600" height="129" rx="20" fill="#fff" stroke="#c5a321"/>
    <rect x="524" y="1024" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="548" y="1055" text-anchor="middle" font-size="22" font-weight="800">5</text>
    <text x="592" y="1035" class="node-title">Evaluar lote</text>
    <text x="592" y="1064" class="node-text">promedio ponderado por área + proporción rechazada</text>
    <text x="592" y="1090" class="node-text">aceptado si promedio ≤ límite y rechazados ≤ 15%</text>
    <text x="592" y="1114" class="small">src/utils/calculations.js · tarjetas y gráficas</text>
  </g>
  <path class="flow" d="M800 1128v38"/>

  <g class="node">
    <rect x="500" y="1170" width="600" height="105" rx="20" fill="#fff" stroke="#83a692"/>
    <rect x="524" y="1196" width="48" height="48" rx="13" fill="#fff3bd"/>
    <text x="548" y="1227" text-anchor="middle" font-size="22" font-weight="800">6</text>
    <text x="592" y="1208" class="node-title">Validar y guardar inspección</text>
    <text x="592" y="1237" class="node-text">campos obligatorios + rollos confirmados</text>
    <text x="592" y="1260" class="small">localStorage en este navegador · máximo 100 registros</text>
  </g>
  <path class="flow" d="M1100 1222h90v-784h10"/>
  <text x="1204" y="790" class="edge-label" transform="rotate(-90 1204 790)">INFORMACIÓN GUARDADA</text>

  <g class="node">
    <rect x="1210" y="340" width="300" height="192" rx="20" fill="#fff" stroke="#79a68b"/>
    <circle cx="1250" cy="382" r="21" fill="#e1f1e7"/>
    <path d="M1240 382h20m-10-10v20" stroke="#3b7657" stroke-width="3" stroke-linecap="round"/>
    <text x="1283" y="380" class="node-title">Base de datos local</text>
    <text x="1240" y="422" class="node-text">Consultar detalle</text>
    <text x="1240" y="448" class="node-text">Editar inspección</text>
    <text x="1240" y="474" class="node-text">Eliminar con confirmación</text>
    <text x="1240" y="509" class="small">services/inspections.js</text>
  </g>

  <path class="flow" d="M1360 532v44"/>
  <g class="node">
    <rect x="1210" y="580" width="300" height="154" rx="20" fill="#fff" stroke="#c5a321"/>
    <circle cx="1250" cy="620" r="21" fill="#fff3bd"/>
    <path d="M1241 620h18m-9-9v18" stroke="#8c720b" stroke-width="3" stroke-linecap="round"/>
    <text x="1283" y="618" class="node-title">Reporte</text>
    <text x="1240" y="660" class="node-text">Texto y tabla HTML</text>
    <text x="1240" y="686" class="node-text">Incluye resumen y rollos</text>
    <text x="1240" y="712" class="small">Se prepara en App.jsx</text>
  </g>

  <path class="flow" d="M1360 734v40h-84v34"/>
  <path class="flow" d="M1360 774h102v34"/>
  <g class="node">
    <rect x="1195" y="812" width="235" height="142" rx="20" fill="#fff" stroke="#79a68b"/>
    <text x="1312" y="850" text-anchor="middle" class="node-title">Enviar correo</text>
    <text x="1312" y="879" text-anchor="middle" class="node-text">EmailJS + adjuntos</text>
    <text x="1312" y="906" text-anchor="middle" class="small">src/services/email.js</text>
    <text x="1312" y="930" text-anchor="middle" class="small">configurar .env.local</text>
  </g>
  <g class="node">
    <rect x="1440" y="812" width="110" height="142" rx="20" fill="#fff" stroke="#79a68b"/>
    <text x="1495" y="850" text-anchor="middle" class="node-title">PDF</text>
    <text x="1495" y="880" text-anchor="middle" class="small">descargar</text>
    <text x="1495" y="904" text-anchor="middle" class="small">o imprimir</text>
    <text x="1495" y="930" text-anchor="middle" class="small">jsPDF</text>
  </g>

  <rect x="1205" y="1000" width="330" height="135" rx="18" fill="#fff8d9" stroke="#ddbf42" stroke-width="2"/>
  <text x="1230" y="1035" font-size="15" font-weight="800">IMPORTANTE</text>
  <text x="1230" y="1064" class="node-text">Los datos se guardan en el navegador.</text>
  <text x="1230" y="1090" class="node-text">El frontend usa EmailJS; la función</text>
  <text x="1230" y="1116" class="node-text">Firebase del repositorio no está conectada.</text>

  <rect x="75" y="1324" width="1450" height="66" rx="18" fill="#fff" stroke="#d8e5dc"/>
  <circle cx="112" cy="1357" r="9" fill="#78a88a"/>
  <text x="136" y="1363" class="small">Flujo basado en el código actual · Los cálculos usan los límites definidos por la aplicación.</text>
</svg>
